<html>
    <head>
        <title>Positioning</title>
        <style>
            .a {
                height: 80px;
                width: 100px;
                background-color: red;
                position: fixed;
                top: 0px;
                right: 30px;
            }
            .b {
                height: 100px;
                width: 150px;
                background-color: green;
                position: sticky;
                top: 80px;
                bottom: 20px;
                left: 30px;
            }
            .c {
                height: 100px;
                width: 150px;
                background-color: blue;
                position: relative;
                top: 50px;
                left: 172px;           }
            .d {
                height: 50px;
                width: 50px;
                background-color: yellow;
                position: absolute;
                top: 25px;
                left: 50px;
            }
        </style>
    </head>
    <body>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <h1>Positioning</h1>
        <div class="a"></div>
        <div class="b"></div>
        <div class="c">
        <div class="d"></div></div>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    </body>
</html>
