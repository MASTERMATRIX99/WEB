<html>
    <head>
        <title>Bootstrap Typography Example</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <h1>Welcome to Bootstrap Typography</h1>
        <h1 class="display-1">Display 1</h1>
        <h1 class="display-2">Display 2</h1>
        <h1 class="display-3">Display 3</h1>
        <h1 class="display-4">Display 4</h1>
        <h1>What did one snowman say to the other snowman?<small class="text-muted">It smells like carrots over here!</small></h1>
        <p>There are many types of selectors in <mark>HTML</mark> like <code>h1,p,title,br</code> etc</p>
    </body>
</html>
