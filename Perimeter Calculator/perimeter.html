<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perimeter Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 400px; margin: auto; }
        label, select, input { display: block; margin: 10px 0; }
        .result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Perimeter Calculator</h2>
        <label for="shape">Select Shape:</label>
        <select id="shape">
            <option value="rectangle">Rectangle</option>
            <option value="square">Square</option>
            <option value="triangle">Triangle</option>
            <option value="circle">Circle</option>
        </select>

        <div id="inputs"></div>

        <button onclick="calculatePerimeter()">Calculate Perimeter</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        const inputsDiv = document.getElementById('inputs');
        const shapeSelect = document.getElementById('shape');

        function updateInputs() {
            const shape = shapeSelect.value;
            let html = '';
            if (shape === 'rectangle') {
                html += '<label>Length: <input type="number" id="length" min="0"></label>';
                html += '<label>Width: <input type="number" id="width" min="0"></label>';
            } else if (shape === 'square') {
                html += '<label>Side: <input type="number" id="side" min="0"></label>';
            } else if (shape === 'triangle') {
                html += '<label>Side 1: <input type="number" id="side1" min="0"></label>';
                html += '<label>Side 2: <input type="number" id="side2" min="0"></label>';
                html += '<label>Side 3: <input type="number" id="side3" min="0"></label>';
            } else if (shape === 'circle') {
                html += '<label>Radius: <input type="number" id="radius" min="0"></label>';
            }
            inputsDiv.innerHTML = html;
        }

        function calculatePerimeter() {
            const shape = shapeSelect.value;
            let perimeter = 0;
            if (shape === 'rectangle') {
                const length = parseFloat(document.getElementById('length').value);
                const width = parseFloat(document.getElementById('width').value);
                if (isNaN(length) || isNaN(width)) {
                    showResult('Please enter valid numbers.');
                    return;
                }
                perimeter = 2 * (length + width);
            } else if (shape === 'square') {
                const side = parseFloat(document.getElementById('side').value);
                if (isNaN(side)) {
                    showResult('Please enter a valid number.');
                    return;
                }
                perimeter = 4 * side;
            } else if (shape === 'triangle') {
                const side1 = parseFloat(document.getElementById('side1').value);
                const side2 = parseFloat(document.getElementById('side2').value);
                const side3 = parseFloat(document.getElementById('side3').value);
                if (isNaN(side1) || isNaN(side2) || isNaN(side3)) {
                    showResult('Please enter valid numbers.');
                    return;
                }
                perimeter = side1 + side2 + side3;
            } else if (shape === 'circle') {
                const radius = parseFloat(document.getElementById('radius').value);
                if (isNaN(radius)) {
                    showResult('Please enter a valid number.');
                    return;
                }
                perimeter = 2 * Math.PI * radius;
            }
            showResult('Perimeter: ' + perimeter.toFixed(2));
        }

        function showResult(message) {
            document.getElementById('result').textContent = message;
        }

        shapeSelect.addEventListener('change', updateInputs);
        window.onload = updateInputs;
    </script>
</body>
</html>
