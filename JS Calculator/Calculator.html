<html>

<head>
    <title>Calculator</title>
</head>

<body>
    <h1>Simple Calculator</h1>
    <p>The "calculator method" refers to using a dedicated device or app to input numbers and operations, which is then
        processed by internal electronic circuits to quickly compute and display the numerical result on a screen.</p>
    <script>
        // Clears the calculator display

        function clearScreen() {

            document.getElementById("result").value = "";

        }

        // Appends the clicked button's value to the display

        function setScreenValue(value) {

            document.getElementById("result").value += value;

        }

        // Calculates and displays the result

        function calculateResult() {

            const resultElement = document.getElementById("result");

            const expression = resultElement.value.trim();

            // Check for empty input

            if (expression === '') {

                resultElement.value = 'Enter an expression';

                return;

            }

            // Evaluate expression and handle errors

            try {

                resultElement.value = eval(expression);

            } catch (e) {

                resultElement.value = 'Invalid expression';

            }

        }
    </script>
</body>

</html>
