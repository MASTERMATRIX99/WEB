<html>
    <head>
        <title>JS Array Sorting Example</title>
    </head>
    <body>
        <h1>Array Example</h1>
        <p>Click the buttons to sort the array in Ascending or Discending order. </p>
        <button onclick="Ascending()">Ascending order</button>
        <button onclick="Discending()">Descending order</button>
        <p id="result"></p>
        <script>
            var points = [40, 100, 1, 5, 25, 10];
            document.getElementById("result").innerHTML = points;
            function Ascending() {
                points.sort(function (a, b) { return a - b });
                document.getElementById("result").innerHTML = points;
            }
            function Discending() {
                points.sort(function (a, b) { return b - a });
                document.getElementById("result").innerHTML = points;
            }
        </script>
    </body>
</html>
