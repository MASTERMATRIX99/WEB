<html>
    <head>
        <title>Bootstrap Carousel and Scrollspy Example</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <div class="container" style="width: 500px;">
        <h2>Bootstrap Carousel Example</h2>
        <div id="myCarousel" class="carousel slide" data-ride="carousel">
            <ol class="carousel-indicators">
                <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
                <li data-target="#myCarousel" data-slide-to="1"></li>
                <li data-target="#myCarousel" data-slide-to="2"></li>
            </ol>
                <div class="carousel-inner">
                    <div class="carousel-item active"><img width="500px" height="500px" src="Adelie-penguin.webp" alt="Penguin"></div>
                    <div class="carousel-item"><img width="500px" height="500px" src="happy-penguin2.jpg" alt="Penguin 2"></div>
                    <div class="carousel-item"><img width="500px" height="500px" src="images (15).jpg" alt="Penguin 3"></div>
                </div>
            <a class="carousel-control-prev" href="#myCarousel" data-slide="prev">
                <span class="carousel-control-prev-icon"></span> </a>
                <a class="carousel-control-next-icon" href="#myCarousel" data-slide="next">
                <span class="carousel-control-next-icon"></span> </a>
        </div>   
        </div> 
    </body>         
</html>
