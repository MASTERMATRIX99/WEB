<html>
    <head>
        <title>Example of Array</title>
    </head>
    <body>
        <h1>Array Example</h1>
        <script>
            var games = ["Fortnite","COD","Valorant","GTA 5","FC 25","God Of War","Hitman","RDR 2","RESIDENT EVIL"]
            document.write(games);
            document.write("<br>");
            document.write("<br>");
            document.write(games[0]);
            document.write("<br>");
            document.write(games[1]);
            document.write("<br>");
            document.write(games[2]);
            document.write("<br>");
            document.write(games[3]);
            document.write("<br>");
            document.write(games[4]);
            document.write("<br>");
            document.write(games[5]);
            document.write("<br>");
            document.write(games[6]);
            document.write("<br>");
            document.write(games[7]);
            document.write("<br>");
            document.write(games[8]);
            document.write("<br>");
            document.write("<br>");
            document.write(games.join(" * "));
            document.write("<br>");
            document.write("<br>");
            games.pop(); 
            document.write(games);
        </script>
    </body>
</html>
