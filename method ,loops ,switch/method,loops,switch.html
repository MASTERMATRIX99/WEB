<html>
    <head>
        <title>method,loops,switch</title>
    </head>
    <body>
        <h2>javascript string methods</h2>
        <script>
            var str = "Hello World";
            document.write(str.toUpperCase());
            document.write("<br>");
            document.write(str.toLowerCase());
            document.write("<br>");
            document.write(str.startsWith("Hello"));
            document.write("<br>");
        </script>
    </body>
</html>
