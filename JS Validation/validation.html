<html>
    <head>
        <title>JS Validation</title>
    </head>
    <body>
        <h1>JS Validation Example</h1>
        <p id ="massage"></p>
        <form name="myform" onsubmit="validateForm()">name:<input type="text" name="fname">
        <input type="submit" value="submit"></form>
        <script>
            function validateForm(){
                var x = document.forms["myform"]["fname"].value;
                if(x ==""){
                    alert("Name must be filled out");
                    return false;
                }
            }
        </script>
    </body>
</html>
