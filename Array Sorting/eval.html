<html>
    <head>
        <title>JS Eval Example</title>
        <body>
            <h1>Eval Example</h1>
            <script>
                var x = 10;
                var y = 20;
                var a = eval("x + y") + "<br>";
                var b = eval("2 * 2") + "<br>";
                var c = eval("y - x") + "<br>";
                var result = a + b + c;
                document.write(result);
            </script>
        </body>
    </head>
</html>
